<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="A perfect first challenge if you're new to HTML and CSS. The card layout doesn't shift, so it's ideal if you haven't learned about building responsive layouts yet."
    />

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="img/favicon-32x32.png"
    />

    <link rel="stylesheet" href="style.css" />
    <title>Frontend Mentor Challenge | QR code component</title>
  </head>
  <body>
    <section class="qr-code" role="main">
      <div class="qr-code-box">
        <img
          src="img/image-qr-code.png"
          alt="QR Code Preview"
          class="qr-code-img"
        />
        <p class="qr-code-text">
          Improve your front-end skills by building projects
        </p>
        <p class="qr-code-subtext">
          Scan the QR code to visit Frontend Mentor and take your coding skills
          to the next level
        </p>
      </div>
    </section>

    <footer class="footer">
      Challenge by
      <a href="https://www.frontendmentor.io?ref=challenge" target="_blank"
        >Frontend Mentor</a
      >. Coded by
      <a href="https://www.linkedin.com/in/hadifarbakhsh" target="_blank"
        >Hadi Farbakhsh</a
      >.
    </footer>
  </body>
</html>
